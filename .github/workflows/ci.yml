name: CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9" # Matches .fvmrc and pubspec.lock SDK constraint (>=3.38.4)

      - run: make init
      - run: flutter test
      - run: flutter analyze --no-fatal-infos
      # - run: flutter build apk --release
