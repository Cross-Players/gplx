include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - lib/l10n/messages_*.dart
    - lib/l10n/l10n.dart
    - lib/l10n/intl/*.dart
    - lib/**.g.dart
    - lib/**.freezed.dart
    - lib/generated/*.dart
    - build/**
    - android/**
    - ios/**
    - macos/**
    - linux/**
